<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leitor QR Desterro</title><script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font-family:Arial;background:#f3f4f6;padding:16px}.box{max-width:650px;margin:auto;background:white;padding:18px;border-radius:16px}button{padding:12px;margin:4px;border:0;border-radius:9px;background:#111827;color:white}pre{white-space:pre-wrap}</style><div class=box><h1>Leitor QR — Desterro/PB</h1><p id=s></p><button id=b>Iniciar câmera</button><button id=p>Parar</button><button id=f>Ler QR por foto</button><input id=i type=file accept="image/*" hidden><div id=r></div><p id=m></p><pre id=d></pre></div><script>
const BACKEND="COLE_AQUI_A_URL_EXEC";const sec=(new URLSearchParams(location.search).get('secao')||'').padStart(3,'0');s.textContent='Seção: '+sec;let q;
function parse(x){let z={secao:'',zona:'',municipio:'',idue:'',aptos:0,comparecimento:0,faltosos:0,validos:0,brancos:0,nulos:0,votos:[]},a=x.split('|'),cargo='';a.forEach(p=>{let j=p.indexOf(':');if(j<1)return;let k=p.slice(0,j),v=p.slice(j+1);if(k==='SECA')z.secao=v.padStart(3,'0');else if(k==='ZONA')z.zona=v;else if(k==='MUNI')z.municipio=v;else if(k==='IDUE')z.idue=v;else if(k==='APTO')z.aptos=+v;else if(k==='COMP')z.comparecimento=+v;else if(k==='FALT')z.faltosos=+v;else if(k==='TOTC')z.validos=+v;else if(k==='BRAN')z.brancos=+v;else if(k==='NULO')z.nulos=+v;else if(k==='CARG')cargo=v;else if(/^\d+$/.test(k)&&/^\d+$/.test(v)&&cargo)z.votos.push({carg:cargo,numero:k,votos:+v})});if(!z.validos)z.validos=z.comparecimento-z.brancos-z.nulos;return z}
async function send(x){let d=parse(x);if(!d.secao)throw Error('QR sem seção');if(sec&&d.secao!==sec)throw Error('QR é da seção '+d.secao);if(d.aptos!==d.comparecimento+d.faltosos)throw Error('Aptos não confere');if(d.comparecimento!==d.validos+d.brancos+d.nulos)throw Error('Comparecimento não confere');document.getElementById('d').textContent=JSON.stringify(d,null,2);let fd=new FormData();fd.append('payload',JSON.stringify(d));await fetch(BACKEND,{method:'POST',body:fd,mode:'no-cors'});m.textContent='QR enviado. Confira LANCAMENTOS e VOTOS.'}
b.onclick=async()=>{try{q=new Html5Qrcode('r');let c=await Html5Qrcode.getCameras();let cam=c.find(x=>/back|rear|traseira/i.test(x.label))||c[0];await q.start(cam.id,{fps:10,qrbox:280},t=>send(t),()=>{});m.textContent='Câmera ativa'}catch(e){m.textContent=String(e)}};p.onclick=async()=>{if(q)await q.stop()};f.onclick=()=>i.click();i.onchange=async e=>{try{let x=new Html5Qrcode('r');await send(await x.scanFile(e.target.files[0],true));await x.clear()}catch(err){m.textContent=String(err)}};</script>
